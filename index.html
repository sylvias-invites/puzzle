<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Svatební pozvánka - Lenka & Patrik</title>
    <!-- Načtení knihovny pro konfety -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Google Fonts pro elegantní písmo -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            color: #333333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card-container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            background: #ffffff;
            padding: 30px 20px;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.5rem;
            font-weight: 600;
            color: #4a5d4e;
            margin-bottom: 30px; /* Mezera mezi jmény a puzzle */
            letter-spacing: 1px;
        }

        /* Styl pro puzzle mřížku (2x2) */
        .puzzle-board {
            display: grid;
            grid-template-columns: repeat(2, 140px);
            grid-template-rows: repeat(2, 140px);
            gap: 4px;
            justify-content: center;
            margin: 0 auto 25px auto; /* Mezera pod puzzle */
            width: 284px;
            height: 284px;
            background-color: #f9f9f9;
            border-radius: 8px;
        }

        .puzzle-piece {
            width: 140px;
            height: 140px;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s ease, border-color 0.2s ease;
            border: 2px solid transparent;
            
            /* Přímý odkaz na tvůj obrázek na GitHubu */
            background-image: url('https://raw.githubusercontent.com/sylvias-invites/puzzle/main/snoubenci.png');
            background-size: 280px 280px;
            background-repeat: no-repeat;
        }

        /* Zvýraznění vybraného dílku před prohozením */
        .puzzle-piece.selected {
            border-color: #8ab092;
            transform: scale(0.96);
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666666;
            margin-bottom: 30px; /* Mezera mezi textem a tlačítkem */
            font-weight: 300;
            transition: opacity 0.4s ease;
        }

        .subtitle.solved {
    font-size: 1.5rem; /* Zvětšené písmo (původní bylo 1.1rem) */
    font-weight: 500;  /* Volitelně: mírně tučnější pro lepší čitelnost */
    color: #4a5d4e;    /* Volitelně: ladící barva do zelena jako nadpis */
       }


        /* Tlačítko po složení */
        .info-button {
            display: inline-block;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s ease, transform 0.3s ease;
            transform: translateY(10px);
            background-color: #5c7462;
            color: #ffffff;
            padding: 14px 24px;
            text-decoration: none;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 12px rgba(92, 116, 98, 0.25);
        }

        .info-button.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .info-button:hover {
            background-color: #4a5d4e;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <!-- Nápisy -->
        <h1>Lenka & Patrik</h1>

        <!-- Puzzle mřížka (teď hned pod jmény) -->
        <div class="puzzle-board" id="board">
            <div class="puzzle-piece" data-correct="0"></div>
            <div class="puzzle-piece" data-correct="1"></div>
            <div class="puzzle-piece" data-correct="2"></div>
            <div class="puzzle-piece" data-correct="3"></div>
        </div>

        <!-- Text je nyní až pod puzzle -->
        <p class="subtitle" id="subtitle-text">Slož puzzle a odhal tajemství</p>

        <!-- Tlačítko pro další kroky -->
        <a href="#dalsi-info" id="btn-more" class="info-button">Pro další informace klikněte sem</a>
    </div>

    <script>
        const bgPositions = [
            '0px 0px',         // Levý horní
            '-140px 0px',      // Pravý horní
            '0px -140px',      // Levý dolní
            '-140px -140px'    // Pravý dolní
        ];

        const pieces = Array.from(document.querySelectorAll('.puzzle-piece'));
        const board = document.getElementById('board');
        let selectedPiece = null;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Pojistka: zkontroluje, zda je stav vzdálený od výhry jen 1 prohození
        function isOneSwapAway(arr) {
            let mismatched = [];
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] !== i) mismatched.push(i);
            }
            if (mismatched.length === 2) {
                let [a, b] = mismatched;
                if (arr[a] === b && arr[b] === a) return true;
            }
            return false;
        }

        function initPuzzle() {
            pieces.forEach(piece => {
                const correctIdx = parseInt(piece.dataset.correct);
                piece.style.backgroundPosition = bgPositions[correctIdx];
            });

            let currentOrder = [0, 1, 2, 3];
            do {
                shuffle(currentOrder);
            } while (
                currentOrder.every((val, index) => val === index) || 
                isOneSwapAway(currentOrder)
            );

            currentOrder.forEach(idx => {
                board.appendChild(pieces[idx]);
            });
        }

        pieces.forEach(piece => {
            piece.addEventListener('click', () => {
                if (!selectedPiece) {
                    selectedPiece = piece;
                    piece.classList.add('selected');
                } else if (selectedPiece === piece) {
                    piece.classList.remove('selected');
                    selectedPiece = null;
                } else {
                    const nextOfFirst = selectedPiece.nextSibling === piece ? selectedPiece : selectedPiece.nextSibling;
                    board.insertBefore(selectedPiece, piece);
                    board.insertBefore(piece, nextOfFirst);

                    selectedPiece.classList.remove('selected');
                    selectedPiece = null;

                    checkWin();
                }
            });
        });

        function checkWin() {
            const currentPieces = Array.from(board.children);
            const isSolved = currentPieces.every((piece, index) => {
                return parseInt(piece.dataset.correct) === index;
            });

            if (isSolved) {
                board.style.gap = '0px';
                currentPieces.forEach(p => {
                    p.style.border = 'none';
                    p.style.borderRadius = '0';
                    p.style.cursor = 'default';
                });

                // Změna textu pod puzzle po úspěšném složení
                const subtitle = document.getElementById('subtitle-text');
                subtitle.style.opacity = 0;
                setTimeout(() => {
                    subtitle.textContent = "Srdečně vás zveme na naši svatbu!";
                    subtitle.classList.add('solved');
                    subtitle.style.opacity = 1;
                }, 300);

                // Spuštění konfet (prodloužené)
                launchConfetti();

                // Zobrazení tlačítka (s prodlevou 2.5s)
                setTimeout(() => {
                    document.getElementById('btn-more').classList.add('visible');
                }, 2500);
            }
        }

        function launchConfetti() {
            const eucalyptusColors = ['#5c7462', '#8ab092', '#c3d5c5', '#ffffff', '#d1d5d1', '#9fa8a0'];
            
            // 1. Vlna
            confetti({
                particleCount: 60,
                spread: 70,
                origin: { y: 0.6 },
                colors: eucalyptusColors,
                shapes: ['square']
            });

            // 2. Vlna
            setTimeout(() => {
                confetti({
                    particleCount: 40,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: eucalyptusColors,
                    shapes: ['square']
                });
                confetti({
                    particleCount: 40,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: eucalyptusColors,
                    shapes: ['square']
                });
            }, 400);

            // 3. Vlna (závěrečný déšť)
            setTimeout(() => {
                confetti({
                    particleCount: 50,
                    spread: 100,
                    origin: { y: 0.3 },
                    colors: eucalyptusColors,
                    shapes: ['square']
                });
            }, 1200);
        }

        initPuzzle();
    </script>
</body>
</html>
